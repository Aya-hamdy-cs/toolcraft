<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color & Gradient Generator - ToolCraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .tool-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .preview-box {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 45px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            padding: 4px;
        }

        .control-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .code-output {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.95rem;
            color: #818cf8;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ToolCraft</a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </header>

    <div class="container">
        <div class="tool-box">
            <h1>Color & Gradient Generator</h1>
            <p class="subtitle">Create custom CSS gradients and color combinations instantly.</p>

            <div class="preview-box" id="gradientPreview"></div>

            <div class="controls-grid">
                <div class="control-group">
                    <label>Color 1</label>
                    <input type="color" id="color1" value="#6366f1" oninput="updateGradient()">
                </div>
                <div class="control-group">
                    <label>Color 2</label>
                    <input type="color" id="color2" value="#a855f7" oninput="updateGradient()">
                </div>
                <div class="control-group">
                    <label>Gradient Direction</label>
                    <select id="direction" onchange="updateGradient()">
                        <option value="to right">To Right</option>
                        <option value="to left">To Left</option>
                        <option value="to bottom">To Bottom</option>
                        <option value="135deg">Diagonal (135deg)</option>
                    </select>
                </div>
            </div>

            <div class="code-output" id="cssCode">background: linear-gradient(to right, #6366f1, #a855f7);</div>

            <button class="btn" onclick="copyCSS()"><i class="fa-regular fa-copy"></i> Copy CSS Code</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ToolCraft. All rights reserved.</p>
    </footer>

    <script>
        function updateGradient() {
            const c1 = document.getElementById('color1').value;
            const c2 = document.getElementById('color2').value;
            const dir = document.getElementById('direction').value;
            
            const gradientCSS = `background: linear-gradient(${dir}, ${c1}, ${c2});`;
            
            document.getElementById('gradientPreview').style.background = `linear-gradient(${dir}, ${c1}, ${c2})`;
            document.getElementById('cssCode').innerText = gradientCSS;
        }

        function copyCSS() {
            const codeText = document.getElementById('cssCode').innerText;
            navigator.clipboard.writeText(codeText);
            alert('CSS Code copied to clipboard!');
        }

        // تشغيل الدالة أول ما الصفحة تفتح
        updateGradient();
    </script>
</body>
</html>
