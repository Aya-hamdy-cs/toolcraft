<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator - ToolCraft PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .tool-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .editor-workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .editor-workspace {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-header label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .output-container {
            width: 100%;
            height: 300px;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            color: #4ade80;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .error-line {
            background-color: rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
            display: block;
            padding-left: 5px;
            color: #fca5a5;
        }

        .error-badge {
            display: inline-block;
            margin-right: 8px;
            font-size: 0.85rem;
        }

        .status-bar {
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            display: block;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            display: block;
        }

        .actions-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .btn-secondary:hover {
            background: #6366f1;
            color: white;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ToolCraft</a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </header>

    <div class="container">
        <div class="tool-box">
            <h1>JSON Formatter & Validator</h1>
            <p class="subtitle">Validate, format, and highlight syntax errors instantly inside your browser.</p>

            <div class="editor-workspace">
                <div class="pane">
                    <div class="pane-header">
                        <label>Input Raw JSON</label>
                    </div>
                    <textarea id="jsonInput" placeholder='Paste your JSON here e.g. {"name": "Aya", "status": "active"}'></textarea>
                </div>

                <div class="pane">
                    <div class="pane-header">
                        <label>Formatted Output / Error Visualizer</label>
                    </div>
                    <div id="jsonOutput" class="output-container">Formatted output or error highlight will appear here...</div>
                </div>
            </div>

            <div id="statusBar" class="status-bar"></div>

            <div class="actions-bar">
                <button class="btn" onclick="validateAndFormatJSON()"><i class="fa-solid fa-check-double"></i> Validate & Format</button>
                <button class="btn btn-secondary" onclick="copyJSON()"><i class="fa-regular fa-copy"></i> Copy Output</button>
                <button class="btn btn-secondary" onclick="clearAll()" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3);"><i class="fa-solid fa-trash"></i> Clear</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ToolCraft. All rights reserved.</p>
    </footer>

       
                 
      
    <script>
        function validateAndFormatJSON() {
            const input = document.getElementById('jsonInput').value;
            const outputBox = document.getElementById('jsonOutput');
            const statusBar = document.getElementById('statusBar');

            if (!input.trim()) {
                statusBar.className = "status-bar status-error";
                statusBar.innerText = "Please enter some JSON data to validate.";
                outputBox.innerText = "";
                return;
            }

            try {
                const parsedObj = JSON.parse(input);
                const formattedStr = JSON.stringify(parsedObj, null, 4);
                
                outputBox.style.color = "#4ade80"; // أخضر لو الكود كله سليم
                outputBox.innerText = formattedStr;
                statusBar.className = "status-bar status-success";
                statusBar.innerHTML = '<i class="fa-solid fa-circle-check"></i> Valid JSON! Formatted successfully.';
                
            } catch (error) {
                let lineMatch = error.message.match(/line (\d+)/i);
                let errorLineNum = lineMatch ? parseInt(lineMatch[1]) : -1;

                let lines = input.split('\n');
                let renderedHTML = "";

                lines.forEach((line, index) => {
                    let currentLineNum = index + 1;
                    let escapedLine = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    if (currentLineNum === errorLineNum) {
                        // السطر الخطأ فقط: أحمر مع الدائرة الحمراء
                        renderedHTML += `<span class="error-line"><span class="error-badge">🔴 [Line ${currentLineNum}]</span> ${escapedLine}</span>\n`;
                    } else {
                        // باقي الأسطر تنزل سليمة باللون الأخضر الهادئ
                        renderedHTML += `<span style="color: #4ade80;">${escapedLine}</span>\n`;
                    }
                });

                outputBox.innerHTML = renderedHTML;

                statusBar.className = "status-bar status-error";
                statusBar.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <strong>Syntax Error:</strong> ${error.message}`;
            }
        }

        function copyJSON() {
            const outputBox = document.getElementById('jsonOutput');
            if (!outputBox.innerText.trim()) {
                alert('No output to copy!');
                return;
            }
            navigator.clipboard.writeText(outputBox.innerText);
            alert('Output copied to clipboard successfully!');
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            const outputBox = document.getElementById('jsonOutput');
            outputBox.innerText = '';
            outputBox.style.color = "#4ade80";
            document.getElementById('statusBar').className = "status-bar";
            document.getElementById('statusBar').innerText = '';
        }
    </script>
</body>
</html>
