<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word & Character Counter | ToolCraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .tool-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            width: 90%;
        }

        .tool-container h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
        }

        .tool-container p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 1rem;
            text-align: center;
        }

        /* شبكة الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-size: 1rem;
            resize: vertical;
            outline: none;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68,.2);
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-layer-group"></i> ToolCraft</a>
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a>
    </header>

    <div class="tool-container">
        <h1>Word & Character Counter</h1>
        <p>Instantly count words, characters, paragraphs, and reading time for your text.</p>

        <!-- بطاقات الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="wordCount">0</h3>
                <p>Words</p>
            </div>
            <div class="stat-card">
                <h3 id="charCount">0</h3>
                <p>Characters</p>
            </div>
            <div class="stat-card">
                <h3 id="paraCount">0</h3>
                <p>Paragraphs</p>
            </div>
            <div class="stat-card">
                <h3 id="readTime">0s</h3>
                <p>Reading Time</p>
            </div>
        </div>

        <!-- صندوق إدخال النص -->
        <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

        <div class="actions">
            <button class="btn-action" id="copyBtn"><i class="fa-solid fa-copy"></i> Copy Text</button>
            <button class="btn-clear" id="clearBtn"><i class="fa-solid fa-trash-can"></i> Clear Text</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ToolCraft. All rights reserved.</p>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const paraCount = document.getElementById('paraCount');
        const readTime = document.getElementById('readTime');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        textInput.addEventListener('input', () => {
            const text = textInput.value;

            // حساب عدد الحروف
            charCount.textContent = text.length;

            // حساب عدد الكلمات (باستخدام الفراغات وتجنب الفراغات الزائدة)
            const words = text.trim() ? text.trim().split(/\s+/) : [];
            wordCount.textContent = words.length;

            // حساب عدد الفقرات (باستخدام أسطر جديدة)
            const paragraphs = text.trim() ? text.split(/\n+/).filter(p => p.trim().length > 0) : [];
            paraCount.textContent = paragraphs.length;

            // حساب وقت القراءة التقريبي (بمعدل 200 كلمة في الدقيقة)
            const seconds = Math.ceil((words.length / 200) * 60);
            if (seconds < 60) {
                readTime.textContent = seconds + 's';
            } else {
                const minutes = (seconds / 60).toFixed(1);
                readTime.textContent = minutes + 'm';
            }
        });

        // زر النسخ
        copyBtn.addEventListener('click', () => {
            textInput.select();
            document.execCommand('copy');
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy Text';
            }, 2000);
        });

        // زر التمشيط/الحذف
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            wordCount.textContent = '0';
            charCount.textContent = '0';
            paraCount.textContent = '0';
            readTime.textContent = '0s';
        });
    </script>

</body>
</html>
